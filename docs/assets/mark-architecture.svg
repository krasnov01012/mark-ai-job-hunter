<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">MARK AI Job Hunter architecture</title>
  <desc id="desc">Vacancies flow from Habr Career and HeadHunter through normalization, deterministic filters, AI scoring, durable state, and Telegram delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101b"/><stop offset="1" stop-color="#02070d"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2432"/><stop offset="1" stop-color="#07131e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#42e8ee"/></marker>
    <style>.node{fill:url(#node);stroke:#1f7180;stroke-width:1.5}.core{stroke:#42e8ee}.accent{fill:#42e8ee}.muted{fill:#7895a4}.label{fill:#e8fbff;font:600 19px Arial,sans-serif}.small{fill:#8eb2bf;font:14px Arial,sans-serif}.line{fill:none;stroke:#42e8ee;stroke-width:2;marker-end:url(#arrow)}.group{fill:none;stroke:#174554;stroke-width:1}</style>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <path d="M30 72H1170" stroke="#123545"/><text x="48" y="48" class="accent" font-family="Arial" font-size="14" letter-spacing="4">MARK / VACANCY INTELLIGENCE PIPELINE</text>
  <rect x="42" y="108" width="250" height="218" rx="18" class="group"/><text x="62" y="138" class="muted" font-family="Arial" font-size="13" letter-spacing="2">SOURCES</text>
  <rect x="72" y="164" width="190" height="58" rx="12" class="node"/><text x="167" y="199" text-anchor="middle" class="label">Habr Career</text>
  <rect x="72" y="242" width="190" height="58" rx="12" class="node"/><text x="167" y="277" text-anchor="middle" class="label">HeadHunter API</text>
  <rect x="344" y="164" width="205" height="136" rx="16" class="node core" filter="url(#glow)"/><text x="446" y="209" text-anchor="middle" class="label">Normalize</text><text x="446" y="236" text-anchor="middle" class="small">dedupe · fetch</text><text x="446" y="259" text-anchor="middle" class="small">shared contract</text>
  <rect x="601" y="164" width="205" height="136" rx="16" class="node"/><text x="703" y="205" text-anchor="middle" class="label">Policy gates</text><text x="703" y="233" text-anchor="middle" class="small">hard filter</text><text x="703" y="256" text-anchor="middle" class="small">level + geography</text>
  <rect x="858" y="164" width="286" height="136" rx="16" class="node core" filter="url(#glow)"/><text x="1001" y="201" text-anchor="middle" class="label">Semantic scoring</text><text x="1001" y="229" text-anchor="middle" class="small">primary → secondary</text><text x="1001" y="252" text-anchor="middle" class="small">strict parser → fallback</text>
  <path d="M262 193H344M262 271H320Q334 271 344 257" class="line"/><path d="M549 232H601M806 232H858" class="line"/>
  <rect x="344" y="390" width="205" height="112" rx="16" class="node"/><text x="446" y="432" text-anchor="middle" class="label">Durable state</text><text x="446" y="459" text-anchor="middle" class="small">source · vacancy · run</text>
  <rect x="601" y="390" width="205" height="112" rx="16" class="node"/><text x="703" y="432" text-anchor="middle" class="label">Delivery</text><text x="703" y="459" text-anchor="middle" class="small">retry-safe vacancy card</text>
  <rect x="858" y="390" width="286" height="112" rx="16" class="node core"/><text x="1001" y="432" text-anchor="middle" class="label">Telegram</text><text x="1001" y="459" text-anchor="middle" class="small">review-ready opportunities</text>
  <path d="M1001 300V350Q1001 365 986 365H461Q446 365 446 390" class="line"/><path d="M549 446H601M806 446H858" class="line"/>
  <rect x="344" y="555" width="800" height="58" rx="14" class="group"/><text x="382" y="590" class="small">n8n orchestration</text><text x="585" y="590" class="small">PostgreSQL persistence</text><text x="828" y="590" class="small">health checks</text><text x="1005" y="590" class="small">verified backups</text>
</svg>
