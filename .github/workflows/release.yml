name: Release gate

on:
  push:
    tags:
      - "v*.*.*"

# This workflow is a gate only. Deployment stays pull-based on the Hostkey
# server, and no server credential is stored in GitHub Actions.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag is a release commit reachable from main
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Refusing malformed release tag: $tag" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Tag $tag does not resolve to the checked-out commit." >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "origin/main is unavailable; refusing to validate the tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Tag $tag is not reachable from origin/main." >&2
            exit 1
          fi

          echo "Validated $tag at $tag_commit against origin/main."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find n8n/code lib scripts -type f \( -name '*.js' -o -name '*.mjs' \) | sort)

      - name: Build workflow export
        run: node scripts/build-main-workflow.mjs --dry-run

      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            node "$test_file"
          done

      - name: Compose contract
        run: >-
          docker compose
          --env-file deploy/mark/.env.example
          -f deploy/mark/compose.yaml
          config --quiet

      - name: Deployment hook contract
        run: bash tests/deploy-hooks.test.sh
