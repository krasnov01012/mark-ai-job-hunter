name: mark

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.29.10}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MARK_BIND_PORT:-5678}:5678
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_POOL_SIZE: "5"

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL:?WEBHOOK_URL is required}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?N8N_EDITOR_BASE_URL is required}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
      TZ: ${GENERIC_TIMEZONE:-Europe/Moscow}
      MARK_TELEGRAM_CHAT_ID: ${MARK_TELEGRAM_CHAT_ID:?MARK_TELEGRAM_CHAT_ID is required}

      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_MAX_CONCURRENCY: "1"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: "900"
      EXECUTIONS_TIMEOUT_MAX: "900"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-1000}

      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n/workflows/ai-job-hunter-main.json:/opt/mark/workflows/ai-job-hunter-main.json:ro
      - ${MARK_MIGRATION_DIR:?MARK_MIGRATION_DIR is required}:/opt/mark/migration:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 60s
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /opt/mark/backup-loop.sh
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      MARK_DEPLOYED_COMMIT: ${MARK_DEPLOYED_COMMIT:?MARK_DEPLOYED_COMMIT is required}
      MARK_N8N_VERSION: ${N8N_VERSION:-2.29.10}
      MARK_POSTGRES_VERSION: ${POSTGRES_VERSION:-16-alpine}
    volumes:
      - n8n_data:/n8n-data:ro
      - ${MARK_BACKUP_DIR:?MARK_BACKUP_DIR is required}:/backups
      - ./scripts/backup-loop.sh:/opt/mark/backup-loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  n8n_data:

networks:
  backend:
    internal: true
  egress:
